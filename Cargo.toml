[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/relay-server",
    "apps/always-on",
    "bindings/ffi",
    "bindings/wasm",
    "examples/two-devices",
]

[workspace.package]
version = "0.2.0-beta.3"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/elektrolytmangel/kith"
authors = ["kith contributors"]

[workspace.dependencies]
# Internal crates (versioned together, see docs/guides/releasing.md)
kith-core = { path = "crates/kith-core", version = "0.2.0-beta.3" }
kith-protocol = { path = "crates/kith-protocol", version = "0.2.0-beta.3" }
kith-crypto = { path = "crates/kith-crypto", version = "0.2.0-beta.3" }
# default-features = false: only crates that need Automerge opt in (it is large on wasm).
kith-merge = { path = "crates/kith-merge", version = "0.2.0-beta.3", default-features = false }
kith-store = { path = "crates/kith-store", version = "0.2.0-beta.3" }
kith-sync = { path = "crates/kith-sync", version = "0.2.0-beta.3" }
kith-client = { path = "crates/kith-client", version = "0.2.0-beta.3" }
kith-relay = { path = "crates/kith-relay", version = "0.2.0-beta.3" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# CRDT for concurrent edits (kith-merge). Needs Rust 1.90, which is why the MSRV is 1.90.
automerge = "0.12"
# Native only (bundles C SQLite); kith-store gates it behind its `sqlite` feature.
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
hex = "0.4"
# File chunk encryption (XChaCha20-Poly1305, REQ-FILE-001); same version OpenMLS uses. Keys and
# nonces come from kith_core, so no RNG features.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# Passphrase key derivation for backups (Argon2id); pure Rust, builds for wasm32.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# Range-based set reconciliation for catch-up (REQ-SYNC-002); sans-IO, no dependencies.
negentropy = "0.5"
# Bounded inflate check of compressed Automerge changes; same features as automerge's own.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Keys are created from getrandom bytes (kith_core::random_bytes), so no RNG trait
# crate is needed and rand_core majors in ed25519-dalek do not affect us.
ed25519-dalek = "3"
# Wipes secrets (org root keys, backup keys and contents) from memory when dropped.
zeroize = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = "0.32"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType", "CloseEvent", "console", "DomException", "Event", "MessageEvent", "WebSocket", "IdbDatabase", "IdbFactory", "IdbObjectStore",
    "IdbObjectStoreParameters", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction",
    "IdbTransactionMode",
] }
# OS randomness. The "js" feature only takes effect on wasm32-unknown-unknown
# (crypto.getRandomValues in browsers and Node).
getrandom = { version = "0.2", features = ["js"] }
# MLS (RFC 9420, REQ-ENC-001). Needs Rust 1.91, which is why the MSRV is 1.91.
# Pure-Rust crypto (RustCrypto) so it builds for wasm32, iOS and Android.
openmls = { version = "0.9", default-features = false }
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
openmls_memory_storage = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# `cargo fuzz` builds with --cfg fuzzing (see fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Library code returns errors instead of panicking on input. Tests may unwrap
# (clippy.toml); the few justified invariants carry an #[allow] with a reason.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
