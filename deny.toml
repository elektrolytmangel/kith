# cargo-deny: checked in CI (`deny` job) and locally with `cargo deny check`.
# See docs/guides/development.md.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it is listed here with a reason.
ignore = [
    # crypto-bigint 0.5 (timing): only reached through the P-256/P-384/secp256k1
    # code that openmls_rust_crypto links in. kith uses one MLS ciphersuite,
    # X25519 + ChaCha20-Poly1305 + Ed25519, and never holds a secret on those
    # curves. Remove once openmls moves to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "curves not used by kith's MLS ciphersuite" },
    # proc-macro-error2 is unmaintained: a build-time macro dependency of
    # hax-lib (libcrux, via openmls). No safe upgrade exists yet.
    { id = "RUSTSEC-2026-0173", reason = "build-time only, no upgrade available" },
    # basic-toml is unmaintained: used by askama's derive macro inside
    # uniffi_bindgen (the FFI binding generator), at build time only.
    { id = "RUSTSEC-2026-0374", reason = "build-time only (uniffi bindgen)" },
]

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft: hpke-rs, uniffi) and
# CDLA-Permissive-2.0 (the Mozilla root certificate data in webpki-roots).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# Several RustCrypto crates exist in two major versions while the ecosystem
# moves; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
