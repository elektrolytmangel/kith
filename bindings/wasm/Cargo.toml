[package]
name = "kith-wasm"
description = "WebAssembly bindings for kith (browser, Electron, Node)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kith-client = { workspace = true, features = ["automerge"] }
kith-store.workspace = true
kith-protocol.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys.workspace = true

[package.metadata.wasm-pack.profile.release]
# Rust >= 1.87 enables these wasm features by default for wasm32-unknown-unknown;
# wasm-opt rejects the module unless it is told to accept them.
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-bulk-memory-opt",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]
