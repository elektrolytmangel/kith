[package]
name = "kith-relay-server"
description = "Standalone RAM-only kith relay (WebSocket). Ships as a Docker image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "kith_relay_server"
path = "src/lib.rs"

[[bin]]
name = "kith-relay"
path = "src/main.rs"

[features]
# Durable relay state in Azure Table Storage (allowed orgs). Off by default: the default build
# stays RAM-only and free of an HTTP client.
azure-state = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:base64", "dep:serde_json"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"], optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { workspace = true, optional = true }
base64 = { version = "0.23", optional = true }
serde_json = { workspace = true, optional = true }
kith-relay.workspace = true
kith-protocol.workspace = true
kith-core.workspace = true
hex.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
kith-client.workspace = true
kith-crypto.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
