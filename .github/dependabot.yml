version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /bindings/kotlin
    schedule: { interval: monthly }
    groups:
      # A new Android Gradle Plugin major usually needs a new Gradle major:
      # update them in one PR so CI can build the combination.
      android-build:
        patterns: ["com.android.*", "gradle-wrapper"]
  # Base images are pinned by digest; Dependabot moves tag and digest together.
  - package-ecosystem: docker
    directories: [/apps/relay-server, /docker]
    schedule: { interval: monthly }
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directories: [/bindings/wasm/tests, /bindings/wasm/tests/browser, /examples/web-vite]
    schedule:
      interval: weekly
