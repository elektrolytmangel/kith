# Builds every package at the version in Cargo.toml and attaches them to a
# GitHub Release, and the relay and always-on container images to ghcr.io.
# Nothing is pushed to any other registry.
#
# Triggers
#   push tag vX.Y.Z           build + GitHub Release
#
# Every release file and image gets a signed build provenance attestation
# (Sigstore, `gh attestation verify`), and the release carries an SPDX SBOM.
# See docs/guides/releasing.md ("Verifying a release").
#   Run workflow (manual)     build only (dry_run, default); packages are kept
#                             as workflow artifacts. Unticking dry_run creates
#                             the release, but only when run on a vX.Y.Z tag.
#
# Configuration: none required. Optional repository variable:
#   NPM_SCOPE   npm package scope without '@' (default: repository owner, lowercase)
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, don't create the release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      npm_scope: ${{ steps.v.outputs.npm_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
            if [ "$EVENT" = push ] || [ "$DRY_RUN" = false ]; then publish=true; fi
          elif [ "$DRY_RUN" = false ]; then
            echo "::error::a release needs a vX.Y.Z tag; run the workflow on a tag or keep dry_run"; exit 1
          fi
          scope="${NPM_SCOPE:-$GITHUB_REPOSITORY_OWNER}"
          {
            echo "version=$version"; echo "publish=$publish"; echo "npm_scope=${scope,,}"
          } >> "$GITHUB_OUTPUT"
          echo "### Release $version (create release: $publish)" >> "$GITHUB_STEP_SUMMARY"
      - run: python3 scripts/reqs.py
      - run: cargo test --workspace --locked

  relay-binaries:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, relay_features: "--features kith-relay-server/azure-state" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, relay_features: "--features kith-relay-server/azure-state" }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # Linux builds (the container images) include the Azure Table state; see docs/guides/deployment-azure.md.
      - run: cargo build --release --locked -p kith-relay-server -p kith-always-on ${{ matrix.relay_features }} --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for bin in kith-relay kith-always-on; do
            name="$bin-$TARGET"
            rm -rf dist && mkdir -p dist
            if [[ "$TARGET" == *windows* ]]; then
              cp "target/$TARGET/release/$bin.exe" dist/
              (cd dist && 7z a "../$name.zip" "$bin.exe" >/dev/null)
            else
              cp "target/$TARGET/release/$bin" dist/
              tar -czf "$name.tar.gz" -C dist "$bin"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-${{ matrix.target }}
          path: |
            kith-relay-${{ matrix.target }}.*
            kith-always-on-${{ matrix.target }}.*

  npm:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: scripts/build-wasm.sh web
        env:
          NPM_SCOPE: ${{ needs.verify.outputs.npm_scope }}
      - run: |
          npm ci --prefix bindings/wasm/tests
          node bindings/wasm/tests/smoke.mjs bindings/wasm/pkg
      - name: Pack (installable with `npm install <release asset URL>`)
        run: |
          v=$(jq -r .version bindings/wasm/pkg/package.json)
          [ "$v" = "$VERSION" ] || { echo "::error::package.json has $v"; exit 1; }
          tgz=$(cd bindings/wasm/pkg && npm pack --silent)
          mv "bindings/wasm/pkg/$tgz" "kith-wasm-$VERSION.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: kith-wasm-*.tgz

  swift:
    needs: verify
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/build-swift.sh
      - name: Test the package against the freshly built framework
        run: swift test
        working-directory: bindings/swift
      - name: Assemble release package (binary target points at the release asset)
        run: |
          checksum=$(cat bindings/swift/KithFFI.xcframework.zip.sha256)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/KithFFI.xcframework.zip"
          out=dist/kith-swift-package; mkdir -p "$out"
          cp -R bindings/swift/Sources "$out/"
          cat > "$out/Package.swift" <<EOF
          // swift-tools-version:5.9
          // Generated by .github/workflows/release.yml for v$VERSION.
          import PackageDescription

          let package = Package(
              name: "Kith",
              platforms: [.iOS(.v15), .macOS(.v12)],
              products: [.library(name: "Kith", targets: ["Kith"])],
              targets: [
                  .binaryTarget(name: "KithFFI", url: "$url", checksum: "$checksum"),
                  .target(name: "Kith", dependencies: ["KithFFI"], path: "Sources/Kith"),
              ]
          )
          EOF
          (cd dist && zip -qry kith-swift-package.zip kith-swift-package)
          cp bindings/swift/KithFFI.xcframework.zip dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift
          path: |
            dist/kith-swift-package.zip
            dist/KithFFI.xcframework.zip

  android:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Uses the committed wrapper (bindings/kotlin/gradlew), validates its jar and caches.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-ndk
      # The runner image ships an NDK; ANDROID_NDK_LATEST_HOME points at it.
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" scripts/build-android.sh
      - run: ./gradlew assembleRelease -Pversion="$VERSION"
        working-directory: bindings/kotlin
      - run: cp bindings/kotlin/kith/build/outputs/aar/kith-release.aar "kith-android-$VERSION.aar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: kith-android-*.aar

  # Container images from the release binaries, on GitHub Packages (ghcr.io).
  # A dry run builds them without pushing. The first push creates the packages
  # as private; make them public once (see docs/guides/deployment.md).
  containers:
    needs: [verify, relay-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: kith-relay, target: relay }
          - { image: kith-always-on, target: always-on }
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PUSH: ${{ needs.verify.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relay-*-unknown-linux-gnu
          path: artifacts
          merge-multiple: true
      - name: Build context
        run: |
          mkdir -p ctx/amd64 ctx/arm64 ctx/data
          touch ctx/data/.keep
          for bin in kith-relay kith-always-on; do
            tar -xzf "artifacts/$bin-x86_64-unknown-linux-gnu.tar.gz" -C ctx/amd64
            tar -xzf "artifacts/$bin-aarch64-unknown-linux-gnu.tar.gz" -C ctx/arm64
          done
          cp docker/Dockerfile ctx/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Smoke test (amd64)
        run: |
          docker buildx build --platform linux/amd64 --target "${{ matrix.target }}" --load -t smoke ctx
          if [ "${{ matrix.target }}" = relay ]; then
            docker run -d --name smoke -p 8080:8080 smoke
            for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
            docker logs smoke; exit 1
          else
            # No arguments: prints the usage and exits with 2, which proves the binary starts.
            code=0; docker run --rm smoke --help || code=$?
            [ "$code" = 2 ] || { echo "unexpected exit code $code"; exit 1; }
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.verify.outputs.version, '-') }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit SBOM and provenance attached to the image index.
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUSH == 'true'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # SPDX SBOM of everything the release is built from (Cargo, npm, Gradle).
  sbom:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: kith-${{ needs.verify.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: kith-*.spdx.json

  github-release:
    needs: [verify, relay-binaries, containers, npm, swift, android, sbom]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: (cd assets && sha256sum -- * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: v${{ needs.verify.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          files: assets/*
