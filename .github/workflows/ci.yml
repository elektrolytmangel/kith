# Runs on every PR and on main. Everything here can also be run locally;
# see docs/guides/development.md ("Run CI locally").
name: CI

# Docs-only changes (Markdown, requirements, ADRs, PLAN.md, issue/PR templates)
# do not start a run. Nothing in the build reads those files. Requirements-only
# changes are checked by requirements.yml instead.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every commit on main gets a full run
  # (otherwise each merge cancels the previous main run's queued macOS jobs).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match rust-version in Cargo.toml.
  MSRV: "1.91"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p kith-store --features sqlite --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux, macOS and Windows: the Rust crates are the desktop library.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      - run: cargo test -p kith-store --features sqlite --locked
      - run: cargo run --locked -p example-two-devices

  # The Azure Table state (feature `azure-state`) against the Azurite emulator.
  relay-azure:
    name: relay azure state
    runs-on: ubuntu-latest
    env:
      KITH_AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://127.0.0.1:10002/devstoreaccount1;
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Azurite
        run: |
          docker run -d --name azurite --network host mcr.microsoft.com/azure-storage/azurite \
            azurite-table --tableHost 127.0.0.1 --skipApiVersionCheck
          for _ in $(seq 1 30); do nc -z 127.0.0.1 10002 && exit 0; sleep 1; done
          docker logs azurite; exit 1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: relay-azure
      - run: cargo clippy -p kith-relay-server --all-targets --features azure-state --locked -- -D warnings
      - run: cargo test -p kith-relay-server --features azure-state --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml.
      - run: RUSTUP_TOOLCHAIN="$MSRV" cargo check --workspace --all-targets --locked
      - run: RUSTUP_TOOLCHAIN="$MSRV" cargo check -p kith-store --features sqlite --all-targets --locked
      - run: RUSTUP_TOOLCHAIN="$MSRV" cargo check -p kith-relay-server --features azure-state --locked

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Core crates compile for wasm32 on their own
        run: |
          for c in kith-core kith-protocol kith-sync kith-crypto kith-store kith-merge kith-client; do
            cargo check --locked --target wasm32-unknown-unknown -p "$c"
          done
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-pack
      - run: scripts/build-wasm.sh web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build the relay (the smoke test runs live sync against it)
        run: cargo build --locked -p kith-relay-server
      - name: Smoke test the npm package
        env:
          KITH_RELAY_BIN: ${{ github.workspace }}/target/debug/kith-relay
        run: |
          npm ci --prefix bindings/wasm/tests
          node bindings/wasm/tests/smoke.mjs bindings/wasm/pkg
      - name: Browser tests (Chromium, strict CSP)
        env:
          KITH_RELAY_BIN: ${{ github.workspace }}/target/debug/kith-relay
        run: |
          npm ci --prefix bindings/wasm/tests/browser
          npx --prefix bindings/wasm/tests/browser playwright install --with-deps chromium
          node bindings/wasm/tests/browser/run.mjs bindings/wasm/pkg
      - name: Example web app builds
        run: |
          npm ci --prefix examples/web-vite
          npm run build --prefix examples/web-vite

  ffi:
    name: UniFFI bindings
    runs-on: ubuntu-latest
    # Catches binding breakage cheaply. The Swift package and the Android AAR
    # are built in full by the jobs below.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p kith-ffi
      - run: scripts/gen-bindings.sh swift target/debug/libkith_ffi.so target/gen/swift
      - run: scripts/gen-bindings.sh kotlin target/debug/libkith_ffi.so target/gen/kotlin

  swift:
    name: Swift package
    runs-on: macos-latest
    # Same build as the release: XCFramework for iOS device, iOS simulator and
    # macOS, then the package's tests against it. macOS runners are free for
    # public repositories; in a private copy of this template, consider
    # limiting this job to pushes to main.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/build-swift.sh
      - run: swift test
        working-directory: bindings/swift

  android:
    name: Android library
    runs-on: ubuntu-latest
    # Same build as the release: native libs for all ABIs, generated Kotlin,
    # then the AAR. Without this job, Gradle/AGP/JNA updates would pass CI
    # untested.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Uses the committed wrapper (bindings/kotlin/gradlew), validates its jar and caches.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-ndk
      # The runner image ships an NDK; ANDROID_NDK_LATEST_HOME points at it.
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" scripts/build-android.sh
      - run: ./gradlew assembleRelease
        working-directory: bindings/kotlin

  requirements:
    name: requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/reqs.py
      - name: Traceability matrix in run summary
        if: always()
        run: cat docs/requirements/TRACEABILITY.md >> "$GITHUB_STEP_SUMMARY"

  relay-image:
    name: relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/relay-server/Dockerfile
          load: true
          tags: kith-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name relay -p 8080:8080 kith-relay:ci
          for _ in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs relay; exit 1
