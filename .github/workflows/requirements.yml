# Checks the requirements and their traceability when only requirement files
# change. ci.yml ignores docs-only changes, so without this a requirements-only
# PR would have no check. Code changes are covered by the `requirements` job
# in ci.yml. Same command as locally: python3 scripts/reqs.py
name: Requirements

on:
  pull_request:
    paths:
      - "docs/requirements/**"
      - "scripts/reqs.py"
      - ".github/workflows/requirements.yml"
  push:
    branches: [main]
    paths:
      - "docs/requirements/**"
      - "scripts/reqs.py"
      - ".github/workflows/requirements.yml"
  workflow_dispatch:

concurrency:
  group: requirements-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  requirements:
    name: requirements (docs only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/reqs.py
      - name: Traceability matrix in run summary
        if: always()
        run: cat docs/requirements/TRACEABILITY.md >> "$GITHUB_STEP_SUMMARY"
