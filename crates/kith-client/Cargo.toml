[package]
name = "kith-client"
description = "High-level client SDK that apps embed (directly or via bindings)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# JSON documents on Automerge (`Client::create_document` & co.) and the Automerge merger
# (kith_client::automerge_merger). Off by default here: it is large on wasm. The bindings enable it.
automerge = ["kith-merge/automerge", "dep:serde_json"]

[dependencies]
kith-core.workspace = true
kith-crypto.workspace = true
kith-store.workspace = true
kith-merge.workspace = true
kith-sync.workspace = true
kith-protocol.workspace = true
thiserror.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
zeroize.workspace = true
serde_json = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true
