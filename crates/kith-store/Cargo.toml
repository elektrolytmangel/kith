[package]
name = "kith-store"
description = "Local storage: storage trait plus in-memory and SQLite backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
kith-core.workspace = true
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }

[features]
default = []
# SQLite backend (REQ-STORE-001). Native targets only: it bundles C code and
# does not build for wasm32-unknown-unknown.
sqlite = ["dep:rusqlite"]

# dev-only so codec tests can sign changes
[dev-dependencies]
kith-crypto.workspace = true
