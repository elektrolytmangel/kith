[package]
name = "kith-net"
description = "Native network client: authenticated WebSocket connection to a kith relay and live sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# wss:// (TLS) connections with the webpki root certificates and the ring
# crypto provider. On by default: relays outside this machine need it.
default = ["tls"]
tls = ["tokio-tungstenite/rustls-tls-webpki-roots", "dep:rustls"]

[dependencies]
kith-client.workspace = true
kith-core.workspace = true
kith-protocol.workspace = true
kith-store.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
kith-relay-server = { path = "../../apps/relay-server" }
kith-crypto.workspace = true
axum.workspace = true
